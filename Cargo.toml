[workspace]
members = [
    "mor_website_core",
    "mor_website_dioxus_ui",
    "mor_website_cli"
]
resolver = "2"
default-members = ["mor_website_dioxus_ui"]
[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", features = ["json"] }
zip = "2.1"
roxmltree = "0.21"