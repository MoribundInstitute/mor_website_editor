name = "MoribundMurdoch"
description = "Two sites, one toggle. Dark mode is pure white-on-black (true B&W), set in IM Fell English — legible retro UI chrome without color tint. Light mode is plain Wikipedia: white paper, blue links, system sans. Variants stay monochrome (soft gray, high contrast)."

preset_css = '''
/* ============================================================
   MoribundMurdoch — dual-world, high-legibility
   DARK  : pure white ink on pure black. IM Fell English.
           Monochrome retro panels only — no green, no gold.
   LIGHT : plain Wikipedia article. sans-serif. Blue links.
   ============================================================ */

/* ---- Mode fonts -------------------------------------------- */
:root {
  --font-body: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --font-heading: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --mm-edge: #3a3a3a;
  --mm-hi: #ffffff;
  --mm-mid: #c8c8c8;
  --mm-lo: #888888;
  --mm-chrome:
    inset 0 0 0 1px #2a2a2a,
    inset 0 0 0 3px #4a4a4a,
    inset 0 0 0 4px #1a1a1a;
}

html[data-theme="light"] {
  --font-body: sans-serif;
  --font-heading: sans-serif;
}

body, button, input, select, textarea {
  font-family: var(--font-body) !important;
  color: var(--fg-base);
}
h1, h2, h3, h4, h5, h6,
.mor-brand, .mor-brand-name, .mor-masthead-title,
.main-header h1 {
  font-family: var(--font-heading) !important;
}

/* Force readable body copy in both modes */
p, li, td, th, label, .prose, .hero-tagline, .section-sub {
  color: var(--fg-base) !important;
}
.fg-muted, .muted, .label, .section-eyebrow, .hero-eyebrow,
.mor-masthead-eyebrow, figcaption, .small {
  color: var(--fg-muted) !important;
}

::selection {
  background: var(--fg-base);
  color: var(--bg-base);
  text-shadow: none;
}

/* ============================================================
   DARK MODE — pure white on black
   ============================================================ */
html:not([data-theme="light"]),
html[data-theme="dark"] {
  color-scheme: dark;
}

html:not([data-theme="light"]) body,
html[data-theme="dark"] body {
  background: #000000 !important;
  background-image: none !important;
  color: #ffffff !important;
}

/* Solid opaque panels — no tinted glass, no hue */
html:not([data-theme="light"]) .main-header,
html:not([data-theme="light"]) .mor-panel,
html:not([data-theme="light"]) .mor-footer,
html:not([data-theme="light"]) .card,
html:not([data-theme="light"]) .mor-post,
html:not([data-theme="light"]) .canvas-core {
  background: #0d0d0d !important;
  color: #ffffff !important;
  border-color: #3a3a3a !important;
  box-shadow: var(--mm-chrome) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

html:not([data-theme="light"]) .main-header {
  background: #000000 !important;
  border-bottom: 1px solid #3a3a3a !important;
}

/* Thin monochrome XP / progress strip under header */
html:not([data-theme="light"]) .main-header::after {
  content: "";
  display: block;
  height: 4px;
  margin: 0;
  border: 0;
  background:
    repeating-linear-gradient(90deg,
      transparent 0 40px,
      #1a1a1a 40px 41px),
    linear-gradient(90deg, #ffffff 0%, #ffffff 55%, #2a2a2a 55%, #2a2a2a 100%);
  opacity: 0.85;
}

html:not([data-theme="light"]) .main-header .mor-brand,
html:not([data-theme="light"]) .main-header .mor-brand:hover,
html:not([data-theme="light"]) .mor-brand-name,
html:not([data-theme="light"]) .branding-title,
html:not([data-theme="light"]) .institute-title {
  color: #ffffff !important;
  background: transparent !important;
  text-shadow: none !important;
  letter-spacing: 0.04em;
}

/* ---- Sidebars: white chips, black text (always readable) ---- */
html:not([data-theme="light"]) .mor-sidebar__section-header,
html:not([data-theme="light"]) .mor-sidebar__section-header:hover,
html:not([data-theme="light"]) .mor-sidebar__section-header:focus-visible,
html:not([data-theme="light"]) button.mor-sidebar__section-header {
  background: #ffffff !important;
  color: #000000 !important;
  border: 1px solid #ffffff !important;
  box-shadow: none !important;
  text-transform: none;
  letter-spacing: normal;
  font-weight: 700;
}
html:not([data-theme="light"]) .mor-sidebar__section-label,
html:not([data-theme="light"]) .mor-sidebar__chevron,
html:not([data-theme="light"]) .mor-sidebar__section-header:hover .mor-sidebar__section-label,
html:not([data-theme="light"]) .mor-sidebar__section-header:focus-visible .mor-sidebar__section-label,
html:not([data-theme="light"]) .mor-sidebar__section-header:hover .mor-sidebar__chevron,
html:not([data-theme="light"]) .mor-sidebar__section-header:focus-visible .mor-sidebar__chevron {
  color: #000000 !important;
}
html:not([data-theme="light"]) .mor-sidebar__items {
  background: transparent !important;
  border-color: #444444 !important;
}

/* Items under Consume/Explore: white text on black (no white chips) */
html:not([data-theme="light"]) .mor-nav > a,
html:not([data-theme="light"]) .nav .pill,
html:not([data-theme="light"]) .mor-sidebar__item,
html:not([data-theme="light"]) .mor-sidebar__item:visited,
html:not([data-theme="light"]) .mor-sidebar__item:hover,
html:not([data-theme="light"]) .mor-sidebar__item:focus-visible,
html:not([data-theme="light"]) .mor-sidebar__item.active,
html:not([data-theme="light"]) .mor-sidebar__item[aria-current="page"],
html:not([data-theme="light"]) .mor-sidebar__item .mor-sidebar__item-label,
html:not([data-theme="light"]) .mor-sidebar__item .mor-sidebar__item-icon {
  color: #ffffff !important;
  background: transparent !important;
  border-color: transparent !important;
  text-shadow: none !important;
  box-shadow: none !important;
}
html:not([data-theme="light"]) .mor-sidebar__item:hover,
html:not([data-theme="light"]) .mor-sidebar__item:focus-visible,
html:not([data-theme="light"]) .mor-nav > a:hover {
  text-decoration: underline !important;
  text-underline-offset: 3px;
  outline: none;
}
html:not([data-theme="light"]) .mor-sidebar__item.active,
html:not([data-theme="light"]) .mor-sidebar__item[aria-current="page"] {
  box-shadow: inset 3px 0 0 #ffffff !important;
  font-weight: 700;
  text-decoration: none !important;
}

/* TOC: white text on black, natural casing */
html:not([data-theme="light"]) .toc-jump-link,
html:not([data-theme="light"]) .toc-jump-link:visited,
html:not([data-theme="light"]) .toc-jump-link:hover,
html:not([data-theme="light"]) .toc-jump-link:focus-visible,
html:not([data-theme="light"]) .toc-jump-link.is-active {
  color: #ffffff !important;
  background: transparent !important;
  border-color: transparent !important;
  text-shadow: none !important;
  text-transform: none !important;
  letter-spacing: normal !important;
}
html:not([data-theme="light"]) .toc-jump-link:hover,
html:not([data-theme="light"]) .toc-jump-link:focus-visible {
  text-decoration: underline !important;
  text-underline-offset: 3px;
}
html:not([data-theme="light"]) .toc-jump-link.is-active {
  box-shadow: inset 3px 0 0 #ffffff !important;
  font-weight: 700;
  text-decoration: none !important;
}

/* Headings: white, no colored gilt */
html:not([data-theme="light"]) h1,
html:not([data-theme="light"]) h2,
html:not([data-theme="light"]) h3,
html:not([data-theme="light"]) h4,
html:not([data-theme="light"]) .hero h1,
html:not([data-theme="light"]) .section-title {
  color: #ffffff !important;
  text-shadow: none !important;
  letter-spacing: 0.02em;
}
html:not([data-theme="light"]) h1 .muted,
html:not([data-theme="light"]) .muted {
  color: #b8b8b8 !important;
}

/* Posts / cards */
html:not([data-theme="light"]) .mor-post {
  padding: 22px 26px 18px;
  margin-bottom: 28px;
  border-radius: 2px;
}
html:not([data-theme="light"]) .mor-post h1 {
  padding-bottom: 10px;
  border-bottom: 1px solid #4a4a4a;
}
html:not([data-theme="light"]) .mor-post h1::before {
  content: "\25C6\0020"; /* ◆ */
  color: #ffffff;
}

/* Prose links only — sidebar/TOC stay white-on-black */
html:not([data-theme="light"]) a {
  color: #ffffff !important;
  border-bottom: 1px solid #666666;
  text-decoration: none;
  background: transparent !important;
}
html:not([data-theme="light"]) a:visited {
  color: #cccccc !important;
  background: transparent !important;
}
html:not([data-theme="light"]) .prose a:hover,
html:not([data-theme="light"]) .hero-tagline a:hover,
html:not([data-theme="light"]) .mor-post a:hover,
html:not([data-theme="light"]) .philosophy-body a:hover {
  background: #ffffff !important;
  color: #000000 !important;
  border-bottom-color: transparent;
  text-shadow: none;
}
html:not([data-theme="light"]) a.mor-sidebar__item:hover,
html:not([data-theme="light"]) a.toc-jump-link:hover,
html:not([data-theme="light"]) a.mor-sidebar__item:focus-visible,
html:not([data-theme="light"]) a.toc-jump-link:focus-visible {
  background: transparent !important;
  color: #ffffff !important;
}

/* Panel titles — black surface, white type */
html:not([data-theme="light"]) .mor-panel summary,
html:not([data-theme="light"]) .mor-toc-title,
html:not([data-theme="light"]) .panel-header,
html:not([data-theme="light"]) .mor-footer h3,
html:not([data-theme="light"]) .mor-footer h4 {
  background: #000000 !important;
  color: #ffffff !important;
  text-transform: none;
  letter-spacing: normal;
  text-shadow: none !important;
  border-bottom: 1px solid #444444 !important;
}
html:not([data-theme="light"]) .panel-header span {
  color: #ffffff !important;
}

/* Forms */
html:not([data-theme="light"]) input,
html:not([data-theme="light"]) textarea,
html:not([data-theme="light"]) select {
  background: #000000 !important;
  color: #ffffff !important;
  border: 1px solid #4a4a4a !important;
  border-radius: 2px !important;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6) !important;
}
html:not([data-theme="light"]) input:focus,
html:not([data-theme="light"]) textarea:focus,
html:not([data-theme="light"]) select:focus {
  border-color: #ffffff !important;
  outline: 1px solid #ffffff !important;
  box-shadow: none !important;
}

/* Primary CTAs only — never style sidebar toggles / section headers as white plaques */
html:not([data-theme="light"]) .mor-btn,
html:not([data-theme="light"]) .btn-primary,
html:not([data-theme="light"]) input[type="submit"] {
  background: #ffffff !important;
  color: #000000 !important;
  border: 1px solid #ffffff !important;
  border-radius: 2px !important;
  box-shadow: none !important;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}
html:not([data-theme="light"]) .btn-ghost {
  background: transparent !important;
  color: #ffffff !important;
  border: 1px solid #666666 !important;
}
html:not([data-theme="light"]) .btn-ghost:hover {
  background: #ffffff !important;
  color: #000000 !important;
}
/* Panel chrome stays white-on-black; section headers already set above */
html:not([data-theme="light"]) button.panel-close-btn,
html:not([data-theme="light"]) button.panel-toggle,
html:not([data-theme="light"]) button.header-panel-toggle {
  background: transparent !important;
  color: #ffffff !important;
  border: 1px solid #555555 !important;
  text-transform: none;
  box-shadow: none !important;
}

/* Code */
html:not([data-theme="light"]) code,
html:not([data-theme="light"]) pre {
  background: #000000 !important;
  color: #e8e8e8 !important;
  border: 1px solid #3a3a3a !important;
}

/* Blockquote */
html:not([data-theme="light"]) blockquote {
  border-left: 3px solid #ffffff !important;
  background: #111111 !important;
  color: #e8e8e8 !important;
  font-style: italic;
}

/* Pills / chips */
html:not([data-theme="light"]) .mor-pill,
html:not([data-theme="light"]) .pill,
html:not([data-theme="light"]) .tag {
  background: #1a1a1a !important;
  border: 1px solid #4a4a4a !important;
  color: #ffffff !important;
  border-radius: 2px !important;
}

/* ============================================================
   LIGHT MODE — plain Wikipedia
   ============================================================ */
html[data-theme="light"] {
  color-scheme: light;
}

html[data-theme="light"] body {
  background: #ffffff !important;
  background-image: none !important;
  color: #202122 !important;
  line-height: 1.6;
}

html[data-theme="light"] .main-header {
  background: #ffffff !important;
  border: none !important;
  border-bottom: 1px solid #a2a9b1 !important;
  box-shadow: none !important;
  border-radius: 0 !important;
}
html[data-theme="light"] .main-header::after {
  content: none !important;
  display: none !important;
}

html[data-theme="light"] .main-header .mor-brand,
html[data-theme="light"] .mor-brand-name,
html[data-theme="light"] .branding-title,
html[data-theme="light"] .institute-title {
  color: #000000 !important;
  background: transparent !important;
  text-shadow: none !important;
  letter-spacing: 0 !important;
  font-weight: 700 !important;
}

html[data-theme="light"] .mor-nav > a,
html[data-theme="light"] .nav .pill {
  color: #0645ad !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
  border-radius: 0 !important;
}
html[data-theme="light"] .mor-nav > a:hover,
html[data-theme="light"] .nav .pill:hover {
  background: #eaecf0 !important;
  color: #0645ad !important;
  text-decoration: underline !important;
}

html[data-theme="light"] h1,
html[data-theme="light"] h2,
html[data-theme="light"] h3,
html[data-theme="light"] h4,
html[data-theme="light"] .hero h1,
html[data-theme="light"] .section-title {
  color: #000000 !important;
  text-shadow: none !important;
  letter-spacing: 0 !important;
  font-weight: 700 !important;
}
html[data-theme="light"] h1 {
  border-bottom: 1px solid #a2a9b1 !important;
  padding-bottom: 0.15em;
}
html[data-theme="light"] h2 {
  border-bottom: 1px solid #a2a9b1 !important;
  padding-bottom: 0.15em;
}
html[data-theme="light"] h1 .muted,
html[data-theme="light"] .muted {
  color: #54595d !important;
}

html[data-theme="light"] .mor-post,
html[data-theme="light"] .canvas-core,
html[data-theme="light"] .card {
  background: #ffffff !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}
html[data-theme="light"] .card {
  border: 1px solid #a2a9b1 !important;
  background: #f8f9fa !important;
}

html[data-theme="light"] .mor-post h1::before,
html[data-theme="light"] .mor-post h1::after,
html[data-theme="light"] .mor-post hr::after {
  content: none !important;
  display: none !important;
}

/* Classic wiki blue / visited purple */
html[data-theme="light"] a {
  color: #0645ad !important;
  border-bottom: none !important;
  text-decoration: none;
  background: transparent !important;
}
html[data-theme="light"] a:visited {
  color: #0b0080 !important;
}
html[data-theme="light"] a:hover,
html[data-theme="light"] a:focus-visible {
  color: #0645ad !important;
  text-decoration: underline !important;
  background: transparent !important;
}

html[data-theme="light"] .mor-panel,
html[data-theme="light"] .mor-footer {
  background: #f8f9fa !important;
  border: 1px solid #a2a9b1 !important;
  box-shadow: none !important;
  border-radius: 2px !important;
}
html[data-theme="light"] .mor-footer {
  border-left: none !important;
  border-right: none !important;
  border-bottom: none !important;
  border-radius: 0 !important;
}
html[data-theme="light"] .mor-panel summary,
html[data-theme="light"] .mor-toc-title,
html[data-theme="light"] .panel-header,
html[data-theme="light"] .mor-footer h3,
html[data-theme="light"] .mor-footer h4 {
  background: #eaecf0 !important;
  color: #000000 !important;
  text-transform: none !important;
  letter-spacing: 0 !important;
  text-shadow: none !important;
  border-bottom: 1px solid #a2a9b1 !important;
  font-weight: 700 !important;
}

html[data-theme="light"] blockquote {
  border-left: 4px solid #a2a9b1 !important;
  background: #f8f9fa !important;
  color: #202122 !important;
  box-shadow: none !important;
  font-style: normal;
}

html[data-theme="light"] code,
html[data-theme="light"] pre {
  background: #f8f9fa !important;
  border: 1px solid #a2a9b1 !important;
  color: #000000 !important;
  font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace !important;
}

html[data-theme="light"] input,
html[data-theme="light"] textarea,
html[data-theme="light"] select {
  background: #ffffff !important;
  color: #000000 !important;
  border: 1px solid #a2a9b1 !important;
  border-radius: 2px !important;
  box-shadow: none !important;
  font-family: sans-serif !important;
}
html[data-theme="light"] input:focus,
html[data-theme="light"] textarea:focus,
html[data-theme="light"] select:focus {
  border-color: #36c !important;
  outline: 1px solid #36c !important;
}

html[data-theme="light"] .mor-btn,
html[data-theme="light"] .btn-primary,
html[data-theme="light"] input[type="submit"] {
  background: #f8f9fa !important;
  color: #202122 !important;
  border: 1px solid #a2a9b1 !important;
  border-radius: 2px !important;
  box-shadow: none !important;
  text-transform: none !important;
  letter-spacing: 0 !important;
  font-weight: 700 !important;
  font-family: sans-serif !important;
}
html[data-theme="light"] button.mor-sidebar__section-header,
html[data-theme="light"] button.panel-close-btn,
html[data-theme="light"] button.panel-toggle,
html[data-theme="light"] button.header-panel-toggle {
  background: transparent !important;
  color: #202122 !important;
  border: 1px solid #a2a9b1 !important;
  box-shadow: none !important;
}
html[data-theme="light"] .btn-primary {
  background: #0645ad !important;
  color: #ffffff !important;
  border-color: #0645ad !important;
}
html[data-theme="light"] .btn-primary:hover {
  background: #0b0080 !important;
  border-color: #0b0080 !important;
  color: #ffffff !important;
}

html[data-theme="light"] .mor-pill,
html[data-theme="light"] .pill,
html[data-theme="light"] .tag {
  background: #eaecf0 !important;
  border: 1px solid #a2a9b1 !important;
  color: #202122 !important;
  border-radius: 2px !important;
  box-shadow: none !important;
}

html[data-theme="light"] table {
  border-collapse: collapse;
  background: #f8f9fa;
  border: 1px solid #a2a9b1;
}
html[data-theme="light"] th {
  background: #eaecf0;
  border: 1px solid #a2a9b1;
  font-weight: 700;
  color: #000000 !important;
}
html[data-theme="light"] td {
  border: 1px solid #a2a9b1;
  color: #202122 !important;
}

/* Default system cursors both modes (legibility first) */
body, a, button, input, textarea {
  cursor: auto;
}
a, button { cursor: pointer; }
input, textarea { cursor: text; }
'''

# ---- Base / dark: pure white-on-black --------------------------
[colors]
bg_base = "#000000"
fg_base = "#ffffff"
fg_muted = "#b0b0b0"
accent = "#ffffff"
border = "#3a3a3a"
panel_border_width = "1px"
glow_spread = "0px"
hover_scale = "1.0"

[colors.bg_panel]
mode = "Solid"
color = "#0d0d0d"

[colors.bg_elevated]
mode = "Solid"
color = "#1a1a1a"

[background.mode.Solid]
color = "#000000"

[typography]
body_font_stack = "'IM Fell English', Georgia, 'Times New Roman', serif"
heading_font_stack = "'IM Fell English', Georgia, 'Times New Roman', serif"
mono_font_stack = "ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace"
base_size = "18px"
scale_ratio = "1.25"
line_height = "1.7"
heading_weight = "400"

[buttons]
radius = "2px"
border_width = "1px"
border_color = "#ffffff"
padding_x = "14px"
padding_y = "7px"
text_transform = "uppercase"
letter_spacing = "0.06em"
font_weight = "700"
font_size = "0.85rem"
text_color = "#000000"
fill = "solid"
bg_color = "#ffffff"
box_shadow = "none"
hover_effect = "none"
pressed_feedback = true
transition_ms = "120ms"
easing = "ease-out"
focus_ring_color = "#ffffff"

# ---- Explicit dark palette (B&W) -------------------------------
[dark.colors]
bg_base = "#000000"
fg_base = "#ffffff"
fg_muted = "#b0b0b0"
accent = "#ffffff"
border = "#3a3a3a"
panel_border_width = "1px"
glow_spread = "0px"
hover_scale = "1.0"

[dark.colors.bg_panel]
mode = "Solid"
color = "#0d0d0d"

[dark.colors.bg_elevated]
mode = "Solid"
color = "#1a1a1a"

[dark.background.mode.Solid]
color = "#000000"

# ---- Light palette: Wikipedia ----------------------------------
[light.colors]
bg_base = "#ffffff"
fg_base = "#202122"
fg_muted = "#54595d"
accent = "#0645ad"
border = "#a2a9b1"
panel_border_width = "1px"
glow_spread = "0px"
hover_scale = "1.0"

[light.colors.bg_panel]
mode = "Solid"
color = "#f8f9fa"

[light.colors.bg_elevated]
mode = "Solid"
color = "#ffffff"

[light.background.mode.Solid]
color = "#ffffff"

[scrollbars]
width = "12px"
track_color = "color-mix(in srgb, var(--fg-base) 8%, var(--bg-base))"
thumb_color = "color-mix(in srgb, var(--fg-base) 40%, var(--bg-base))"
thumb_hover_color = "var(--fg-base)"

# --- Monochrome variants only (no hue) --------------------------

[[variants]]
name = "Soft Gray"
[variants.dark]
colors = { bg_base = "#0a0a0a", fg_base = "#f2f2f2", fg_muted = "#a8a8a8", accent = "#f2f2f2", border = "#404040", bg_panel = { mode = "Solid", color = "#141414" }, bg_elevated = { mode = "Solid", color = "#1e1e1e" } }
background = { mode = { Solid = { color = "#0a0a0a" } } }
[variants.light]
colors = { bg_base = "#f8f9fa", fg_base = "#202122", fg_muted = "#54595d", accent = "#0645ad", border = "#a2a9b1", bg_panel = { mode = "Solid", color = "#ffffff" }, bg_elevated = { mode = "Solid", color = "#ffffff" } }
background = { mode = { Solid = { color = "#f8f9fa" } } }

[[variants]]
name = "High Contrast"
[variants.dark]
